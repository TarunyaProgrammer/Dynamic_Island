name: Documentation improvement
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels: [docs]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the file, heading, or page that needs work.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
