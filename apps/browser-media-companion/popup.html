<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{width:320px;margin:0;padding:16px;box-sizing:border-box;background:#101114;color:#f5f5f7}header{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:#f5f5f7;color:#16171b;font-size:17px}h1{margin:0;font-size:14px;letter-spacing:-.01em}p{color:#a9acb5;font-size:12px;line-height:1.45;margin:6px 0 12px}label{display:block;color:#c7cad2;font-size:11px;font-weight:600;margin-bottom:5px}textarea,input{box-sizing:border-box;width:100%;border:1px solid #333640;border-radius:8px;background:#1a1c21;color:#f5f5f7;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px}textarea{min-height:56px;resize:vertical}input{margin-bottom:9px}button{border:0;border-radius:8px;padding:9px 11px;color:#101114;background:#f5f5f7;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}button.secondary{background:#292c33;color:#f5f5f7}.row{display:flex;gap:8px;align-items:center}.row button{flex:1}details{margin-top:12px}summary{cursor:pointer;color:#a9acb5;font-size:11px}.status{min-height:17px;margin:10px 0 0;color:#9fe1b3}.status.error{color:#ffaaa9}.hint{margin-top:13px;padding-top:11px;border-top:1px solid #292c33;color:#858995;font-size:11px;line-height:1.4}
</style></head><body>
<header><span class="mark">◉</span><div><h1>Beacon Media Companion</h1><p>Control media in this Chrome tab from Beacon.</p></div></header>
<label for="pairing-link">1. Paste the link copied from Beacon</label><textarea id="pairing-link" spellcheck="false" placeholder="beacon://pair/…"></textarea>
<div class="row"><button id="pair">Connect to Beacon</button><button id="active" class="secondary">Observe this tab</button></div><p id="status" class="status" aria-live="polite"></p>
<details><summary>Enter port and token manually</summary><label for="port">Bridge port</label><input id="port" type="number" min="1" max="65535"><label for="token">Pairing token</label><input id="token" type="password" spellcheck="false"></details>
<div class="hint">Keep Beacon open while connected. The companion reads only playback details from supported tabs—never page content.</div><script type="module" src="popup.js"></script>
</body></html>
