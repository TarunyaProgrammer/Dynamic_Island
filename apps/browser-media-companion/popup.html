<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon Media Companion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg-base: #0B0C10;
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-surface-hover: rgba(255, 255, 255, 0.07);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(249, 115, 22, 0.5);
      --amber-500: #F97316;
      --amber-400: #FB923C;
      --amber-600: #EA580C;
      --amber-glow: rgba(249, 115, 22, 0.2);
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --success: #10B981;
      --error: #EF4444;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      background: var(--bg-base);
      background-image: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.1) 0%, transparent 65%);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      box-shadow: 0 2px 8px var(--amber-glow);
      display: block;
    }

    .brand-text h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .brand-text span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--amber-400);
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .status-pill.connected {
      color: #A7F3D0;
      border-color: rgba(16, 185, 129, 0.25);
      background: rgba(16, 185, 129, 0.08);
    }
    .status-pill.connected .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-pill.connecting {
      color: #FDE68A;
      border-color: rgba(245, 158, 11, 0.25);
      background: rgba(245, 158, 11, 0.08);
    }
    .status-pill.connecting .status-dot {
      background: var(--amber-500);
      box-shadow: 0 0 8px var(--amber-glow);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .status-pill.error {
      color: #FECACA;
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.08);
    }
    .status-pill.error .status-dot {
      background: var(--error);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      backdrop-filter: blur(10px);
    }

    /* Live Media Player Card */
    .media-card {
      display: none;
      border-color: rgba(249, 115, 22, 0.25);
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .media-card.visible {
      display: block;
    }

    .media-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .media-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--amber-400);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .media-island-tag {
      font-size: 9px;
      color: #7DD3FC;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .media-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .media-art {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
      background: #1C1E24;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .media-info {
      flex: 1;
      min-width: 0;
    }

    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .media-artist {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--amber-500);
      color: #FFFFFF;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .media-play-btn:hover {
      background: var(--amber-400);
      transform: scale(1.05);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--amber-500) 0%, var(--amber-600) 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 10px var(--amber-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--amber-400) 0%, var(--amber-500) 100%);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
      padding: 4px 8px;
      font-size: 11px;
    }
    .btn-ghost:hover {
      color: var(--text-primary);
      background: var(--bg-surface);
    }

    .btn-icon {
      padding: 6px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-icon:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Section Headings */
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* Input & Textarea */
    input, textarea {
      width: 100%;
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      background: #12141A;
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      padding: 7px 9px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
    }

    textarea {
      min-height: 48px;
      resize: none;
      line-height: 1.4;
    }

    /* Key & Port Display Card */
    .key-card {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.25);
    }

    .key-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .port-tag {
      font-size: 10px;
      font-weight: 600;
      color: var(--amber-400);
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, Menlo, monospace;
    }

    .key-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .key-input-wrap input {
      flex: 1;
      letter-spacing: 0.05em;
    }

    /* Details Toggle */
    details {
      margin-top: 8px;
    }
    summary {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      outline: none;
    }
    summary:hover {
      color: var(--text-primary);
    }

    .status-msg {
      font-size: 11px;
      min-height: 16px;
      margin: 8px 0 2px;
      color: #6EE7B7;
      display: flex;
      align-items: center;
      gap: 5px;
      line-height: 1.35;
    }
    .status-msg.error {
      color: #F87171;
    }

    .footer-hint {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    svg {
      flex-shrink: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-wrap">
      <img class="brand-logo" src="icons/icon-128.png" alt="Beacon">
      <div class="brand-text">
        <h1>Beacon</h1>
        <span>Media Companion</span>
      </div>
    </div>
    <div id="status-pill" class="status-pill">
      <div class="status-dot"></div>
      <span id="status-label">Ready</span>
    </div>
  </header>

  <!-- Live Media Card (shown when tab audio is detected) -->
  <div id="media-card" class="card media-card">
    <div class="media-header">
      <span class="media-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Now Streaming
      </span>
      <span class="media-island-tag">Synced to Island</span>
    </div>
    <div class="media-content">
      <img id="media-art" class="media-art" src="" alt="Album Artwork" style="display: none;">
      <div id="media-art-fallback" class="media-art">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="media-info">
        <div id="media-title" class="media-title">Nothing Playing</div>
        <div id="media-artist" class="media-artist">Tab Media</div>
      </div>
      <button id="media-play-btn" class="media-play-btn" title="Toggle Play / Pause">
        <svg id="media-play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="media-pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Primary Fast Pairing Action: Paste from Clipboard -->
  <div class="card">
    <div class="section-label">
      <span>1-Click Connection</span>
      <span style="font-weight: 500; text-transform: none; color: var(--text-muted);">From Mac Dynamic Island</span>
    </div>
    <div class="row">
      <button id="paste-and-connect-btn" class="btn btn-primary" title="Read beacon://pair/... from clipboard and connect instantly">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <span>Paste from Clipboard</span>
      </button>
      <button id="active-tab-btn" class="btn btn-secondary" style="width: auto; white-space: nowrap;" title="Inject media observer into current active tab">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        <span>Observe tab</span>
      </button>
    </div>

    <!-- Status message feedback -->
    <div id="status-msg" class="status-msg" role="status" aria-live="polite"></div>
  </div>

  <!-- Security Key & Manual Pairing Card -->
  <div class="card key-card">
    <div class="key-meta-row">
      <span class="section-label" style="margin-bottom: 0;">Bridge Security Key</span>
      <span id="port-badge" class="port-tag">Port --</span>
    </div>

    <div class="key-input-wrap" style="margin-top: 6px;">
      <input id="key-token-input" type="password" spellcheck="false" placeholder="Beacon Pairing Key" readonly>
      <button id="toggle-key-visibility-btn" class="btn-icon" title="Show / Hide Key">
        <!-- Eye icon -->
        <svg id="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <!-- Eye off icon -->
        <svg id="eye-off-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <button id="copy-key-btn" class="btn-icon" title="Copy Key to Clipboard">
        <svg id="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg id="copy-check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" style="display: none;"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>

    <!-- Collapsible Advanced / Manual Paste -->
    <details id="manual-details">
      <summary>Enter or Paste Link Manually</summary>
      <div style="margin-top: 8px;">
        <textarea id="pairing-link-input" spellcheck="false" placeholder="Paste beacon://pair/56078/token..."></textarea>
        <div class="row" style="margin-top: 6px;">
          <button id="manual-connect-btn" class="btn btn-secondary" style="flex: 1;">Connect Link</button>
          <button id="unpair-btn" class="btn btn-ghost" style="color: #F87171;" title="Clear pairing and disconnect">Forget</button>
        </div>
      </div>
    </details>
  </div>

  <!-- Footer Info -->
  <div class="footer-hint">
    <span>Private loopback bridge on Mac</span>
    <span id="site-support-info">YouTube • Spotify • Soundcloud</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
